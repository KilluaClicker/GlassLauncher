<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MineRich">
  <defs>
    <linearGradient id="mr-bg" x1="28" y1="18" x2="228" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff63b4"/>
      <stop offset="0.48" stop-color="#e21b82"/>
      <stop offset="1" stop-color="#8f0b52"/>
    </linearGradient>
    <radialGradient id="mr-gloss" cx="0" cy="0" r="1" gradientTransform="translate(76 54) rotate(47) scale(190)">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
